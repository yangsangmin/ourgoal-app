name: Web Push dispatch

# 발송 트리거는 Supabase pg_cron(docs/sql/2026-09-08-push-cron.sql, 매분)이다.
# 이전의 GitHub Actions */5 스케줄은 59시간 동안 22회만 돌고(간격 중앙값 128분,
# 5분 이하 0회) "설정한 시각에 도착"을 보장하지 못해 2026-09-08 제거했다.
# 이 워크플로는 수동 점검용(workflow_dispatch)으로만 남긴다.
on:
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call push-dispatch endpoint
        run: |
          curl -sf -X POST "${{ vars.PUSH_DISPATCH_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
