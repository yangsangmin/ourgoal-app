name: Web Push dispatch

# Vercel Hobby 플랜은 크론을 하루 1회로 제한해 vercel.json cron으로는
# 5분 간격 발송이 불가능하다(배포 실패 확인됨). 대신 무료인 GitHub Actions
# 스케줄로 /api/push-dispatch를 주기 호출한다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call push-dispatch endpoint
        run: |
          curl -sf -X POST "${{ vars.PUSH_DISPATCH_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
