name: OurGoal Independent Court Gatekeeper (v4)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issue_comment:
    types: [created]

jobs:
  court-adjudication:
    name: "🏛️ Independent Court Adjudication"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, 'court'))
    steps:
      - name: 1. Checkout Codebase (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Court & E2E Testing Dependencies
        run: |
          npm ci || npm install
          npm install -g @playwright/test @babel/parser @babel/traverse
          npx playwright install --with-deps chromium

      - name: 4. Execute Court Engine (v4 AST & Level 5 E2E Validation)
        id: court_engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node court/engine.js "$PR_NUMBER" 2>&1 | tee court_execution.log
          echo "VERDICT_STATUS=$(grep 'COURT VERDICT:' court_execution.log | tail -n 1 | awk '{print $3}')" >> $GITHUB_ENV

      - name: 5. Post Official Court Verdict Comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number || (context.payload.pull_request && context.payload.pull_request.number);
            let verdictLog = "독립 법정 집행 중 알 수 없는 에러가 발생했습니다.";
            if (fs.existsSync('court_execution.log')) {
              verdictLog = fs.readFileSync('court_execution.log', 'utf8');
            }
            const isPassed = verdictLog.includes('COURT VERDICT: PASSED');
            const isHalted = verdictLog.includes('HALT') || verdictLog.includes('상민님 결심 필요');
            const titleHeader = isPassed ? "### 🏛️ [COURT VERDICT: PASSED] 최종 통과 승인 판정서" : (isHalted ? "### 🚨 [COURT VERDICT: HALTED] 3회 연속 실패 - 상민님 결심 필요" : "### ❌ [COURT VERDICT: REJECTED] 위헌/결함 반려 진단서");
            const commentBody = `${titleHeader}\n\n\`\`\`text\n${verdictLog.trim()}\n\`\`\`\n\n*본 판정서는 작업자의 자가채점이 배제된 GitHub Actions 독립 법정의 원문 기록입니다.*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });

      - name: 6. Enforce Strict Gatekeeper Block on Rejection
        if: "!contains(env.VERDICT_STATUS, 'PASSED')"
        run: |
          echo "❌ 독립 법정 검증 실패: PR 병합이 철통 차단됩니다."
          exit 1
