name: court-publish

# 법정 판정 게시 — court 워크플로가 끝나면 그 판정서 머리의 굵은 네 줄을 PR 고정 댓글로 단다.
#
# 왜 따로 있는가
#   심사 잡(court.yml)은 PR 코드를 실행하므로 쓰기 권한을 줄 수 없다. 댓글을 달려면 쓰기 권한이 필요하다.
#   그래서 "PR 코드를 실행하는 잡(쓰기 권한 없음)"과 "댓글을 다는 잡(PR 코드를 만지지 않음)"을 나눈다.
#
# 이 워크플로는 PR 코드를 체크아웃하지도 실행하지도 않는다. 받는 것은 court 잡이 올린 자료(아티팩트)와,
#   기준 브랜치(main)의 court/chat.js 한 파일(법정 댓글의 형식·이력 함수 — court 워크플로의 ⑥-1 과 같은 함수를 쓰려고 받는다)뿐이다.
#   자료는 "남이 쓴 글"로 취급한다: 형식을 검증하고, 줄바꿈·표식·멘션을 걸러서 댓글에 옮기며, 자료 안의 어떤 글자도 실행하지 않는다.
#   (판정서 안에는 작업자가 쓴 주장 문장이 들어 있다. 그 문장이 댓글 안에서 "판정 줄"을 흉내 내지 못하게 한다.)
#
# 이 PR 의 이력(법정 고정 댓글의 숨은 한 줄 <!-- court-history … -->)
#   ① 이 PR 이 몇 번 돌려보내졌는가(같은 커밋을 다시 돌린 것은 세지 않는다) — 넷째 줄 끝에 "이 PR 돌려보냄 누적 N회"로 찍는다.
#      3회부터 돌려보냄의 둘째 줄은 "[결심 필요] 대상"으로 바뀐다(헌법 제12조: 한 PR 에서 돌려보냄 3회 누적이면 작업자는 멈추고 보고한다).
#   ② 앞선 심사에서 "안 됨"이던 지시 — 법정이 다시 확인해 주기 전에는 목록에서 빠지지 않는다. 새 판정에서 확인 없이 다른 칸으로 바뀌었으면
#      첫 줄을 "돌려보냄 — 앞선 심사에서 안 됨이던 지시 N건이 확인 없이 바뀜"으로 게시한다(그때 court 검사는 court.yml ⑥-1·⑨ 가 실패로 둔다).
#   이력은 법정 계정(github-actions[bot])이 쓴 댓글에서만 읽는다. 횟수는 작업자가 적는 값이 아니다.
#   ③ 그 댓글을 마지막으로 고친 계정도 본다. 법정 계정이 아니면 앞선 기록을 믿지 않는다: 누적 횟수를 3회 이상으로 올리고,
#      둘째 줄을 "[결심 필요] 대상 — 법정 기록이 사람 계정(계정 이름)에 의해 고쳐졌습니다"로 게시한다. 고친 계정은 이력에 남아 그 PR 에서는 지워지지 않는다
#      (그때 court 검사는 court.yml ⑥-1·⑨ 가 실패로 둔다). 판단 함수는 court/chat.js 의 editorTrust·distrust 다.
on:
  workflow_run:
    workflows: [court]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 취소된 심사(같은 PR 에 새 커밋이 와서 그만둔 것)는 게시하지 않는다. 새 커밋의 심사 결과가 곧 게시된다.
    if: github.event.workflow_run.event == 'pull_request_target' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      # workflow_run 에서 github.sha 는 기준 브랜치(main)의 최신 커밋이다 — PR 이 고를 수 없다. 받는 것은 court/chat.js 한 파일뿐이다.
      - name: 법정 댓글 형식 도구 받기 (기준 브랜치의 court/chat.js — PR 코드가 아니다)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: |
            court/chat.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 판정 자료 받기 (없으면 '심사 못 함'으로 게시한다)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: court-verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 판정서 머리의 굵은 네 줄을 PR 고정 댓글로 게시
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const WORKSPACE = process.env.GITHUB_WORKSPACE || '.';
            // 법정 고정 댓글의 형식(표식·이력 한 줄)은 court/chat.js 한곳에 있다. court 워크플로의 ⑥-1(앞선 심사 대조)과 같은 함수로 센다.
            const chat = require(path.join(WORKSPACE, 'trusted', 'court', 'chat.js'));
            const MARKER = chat.MARKER;
            const VERDICTS = ['통과', '확인 부족', '돌려보냄', '심사 못 함'];
            const ESCALATE_AT = chat.ESCALATE_AT; // 한 PR 에서 돌려보냄이 이만큼(3) 쌓이면 작업자는 멈추고 상민님께 보고한다
            const run = context.payload.workflow_run;
            // 판정서를 못 읽었을 때 넷째 줄에 쓰는 실행 장소. 판정서가 있으면 판정서의 글자를 그대로 쓴다(법정도 같은 실행 번호를 찍는다).
            const WHERE = 'GitHub 에서 법정이 직접 실행(작업자 PC 밖 · 실행 번호 ' + run.id + ')';
            const { owner, repo } = context.repo;
            const fullName = owner + '/' + repo;
            const dir = path.join(WORKSPACE, 'verdict');

            // 자료는 남이 쓴 글이다: 크기 상한, 일반 파일만, 파싱 실패는 "없음"으로.
            const readText = name => {
              try { const p = path.join(dir, name); const st = fs.lstatSync(p); if (!st.isFile() || st.size > 8 * 1024 * 1024) return null; return fs.readFileSync(p, 'utf8'); } catch (_) { return null; }
            };
            const readJson = name => { const t = readText(name); if (t === null) return null; try { return JSON.parse(t); } catch (_) { return null; } };
            // 댓글에 옮기는 글자는 한 줄로 펴고, 댓글 표식·HTML·멘션·표 구분자를 무력화한다.
            const clean = (s, max) => String(s === null || s === undefined ? '' : s)
              .replace(/<!--|-->/g, ' ').replace(/[\r\n\t]+/g, ' ').replace(/</g, '&lt;').replace(/@/g, '&#64;').replace(/\|/g, '/')
              .replace(/\s+/g, ' ').trim().slice(0, max || 300);
            const isSha = s => typeof s === 'string' && /^[0-9a-f]{40}$/.test(s);

            function verdictProblems(v) {
              if (!v || typeof v !== 'object' || Array.isArray(v)) return ['verdict.json 이 없거나 읽을 수 없다'];
              const bad = [];
              if (v.schema !== 'court-verdict/1') bad.push('schema 가 court-verdict/1 이 아니다');
              if (!VERDICTS.includes(v.verdict)) bad.push('verdict 가 네 값(통과·확인 부족·돌려보냄·심사 못 함) 중 하나가 아니다');
              if (typeof v.verdictId !== 'string' || !/^[0-9A-Fa-f]{8}$/.test(v.verdictId)) bad.push('verdictId 가 8자 16진수가 아니다');
              if (!v.head || !isSha(v.head.sha)) bad.push('head.sha 가 없다');
              if (v.where !== 'ci') bad.push('GitHub 에서 실행된 판정이 아니다');
              if (v.quick) bad.push('빠른 점검 결과다(화면 점검 없음)');
              return bad;
            }

            // 판정서(REPORT.md) 머리의 굵은 네 줄을 "그대로" 가져온다. 그 네 줄은 파일의 1~4행이 아니다(제목·안내 줄이 먼저 온다).
            // 넷째 줄에는 판정번호가 찍혀 있다. GitHub 에서 돈 판정의 번호에는 그 실행의 번호가 섞여 들어가므로(court/judge.js),
            // 작업자 PC 에서 미리 돌려 본 번호와 같지 않다. 그 줄을 닻으로 삼아 바로 위 세 줄까지를 굵은 네 줄로 읽는다(줄 번호에 기대지 않는다).
            // 닻에만 기대지도 않는다: 굵은 줄 안의 글자는 법정이 ** 를 걸러 찍고(report.js), 아래에서 첫 줄·둘째 줄의 머리말도 맞춰 본다.
            function firstFourFromReport(text, v) {
              if (typeof text !== 'string') return null;
              const lines = text.split('\n').map(l => l.replace(/\s+$/, ''));
              const i4 = lines.findIndex(l => l.startsWith('**심사 대상 커밋 ') && l.includes('판정번호 ' + v.verdictId));
              if (i4 < 3) return null;
              const four = lines.slice(i4 - 3, i4 + 1);
              if (!four.every(l => /^\*\*.+\*\*$/.test(l))) return null;
              if (!four[0].startsWith('**판정: ' + v.verdict)) return null;
              if (!four[1].startsWith('**상민님이 하실 일: ')) return null;
              return four.map(l => l.slice(2, -2));
            }
            function firstFourFromJson(v) {
              const counts = v.rollup && v.rollup.counts && typeof v.rollup.counts === 'object' ? v.rollup.counts : null;
              // 분포가 없을 때는 왜 없는지를 사실대로 적는다(court/report.js 의 distributionLine 과 같은 갈래). 주장 파일이 있는 심사에 "주장을 내지 않았다"고 적으면 거짓이다.
              const why = v.verdict === '심사 못 함' ? '심사하지 못했습니다' : (v.quick ? '빠른 점검에서는 주장을 심사하지 않습니다' : (v.browserSkipped ? '제품 코드 변경이 없어 주장 심사 대상이 아닙니다' : (v.claimsFile ? '주장을 심사하지 못했습니다' : '작업자가 주장을 내지 않았습니다')));
              return [
                '판정: ' + v.verdict + (v.headline ? ' — ' + v.headline : ''),
                '상민님이 하실 일: ' + (v.todo || ''),
                counts ? '작업자가 적어 낸 지시 항목 ' + v.rollup.total + '건 중: ' + Object.keys(counts).map(k => k + ' ' + counts[k]).join(' · ') : '지시 항목 기준 분포: 없음(' + why + ')',
                '심사 대상 커밋 ' + v.head.sha.slice(0, 7) + ' (기준 ' + String((v.base && v.base.sha) || '?').slice(0, 7) + ') · 판정번호 ' + v.verdictId + ' · ' + (typeof v.whereText === 'string' && v.whereText ? v.whereText : WHERE),
              ];
            }
            function cannotJudgeFour(reason, todo, sha) {
              return [
                '판정: 심사 못 함(법정 도구 고장 — 통과가 아닙니다) — ' + reason,
                '상민님이 하실 일: ' + (todo || '없음. 법정 도구를 고친 뒤 다시 심사합니다. 통과가 아니므로 배포를 결정하실 단계가 아닙니다.'),
                '지시 항목 기준 분포: 없음(심사하지 못했습니다)',
                '심사 대상 커밋 ' + (sha ? sha.slice(0, 7) : '알 수 없음') + ' · 판정번호 없음 · ' + WHERE,
              ];
            }

            // 이력을 굵은 네 줄에 반영한다(순수 함수). o = { laundered[], rejects(이번 심사까지의 누적), rejectedNow(이번 심사가 돌려보냄인가),
            //   editedBy(법정 기록을 법정이 아닌 계정이 고친 적이 있으면 ["계정","u"|"o"], 없으면 null) }
            //   넷째 줄 끝에는 언제나 누적 횟수를 붙인다. 바꾼 줄의 원문은 notes 로 돌려주어 댓글 본문에 남긴다.
            function applyHistory(four, o) {
              const out = four.slice();
              const notes = [];
              const who = o.editedBy ? chat.editedByText(o.editedBy) : null;
              if (who && /^판정: (통과|확인 부족)/.test(four[0])) {
                // 법정 기록이 고쳐진 PR 에서는 통과·확인 부족이 나오지 않는다(court.yml ⑥-1 이 검사를 실패로 둔다 — 첫 줄도 그 결론과 같게 게시한다).
                notes.push('법정 판정서의 첫 줄(법정 기록이 고쳐진 것을 반영하기 전): ' + four[0]);
                out[0] = '판정: 돌려보냄(다시 해야 함) — 법정 기록이 ' + who + '에 의해 고쳐져 이 PR 의 앞선 심사 기록을 믿을 수 없음';
              } else if (o.laundered.length) {
                notes.push('법정 판정서의 첫 줄(앞선 심사와 맞대기 전): ' + four[0]);
                notes.push('법정 판정서의 둘째 줄(앞선 심사와 맞대기 전): ' + four[1]);
                out[0] = '판정: 돌려보냄(다시 해야 함) — 앞선 심사에서 안 됨이던 지시 ' + o.laundered.length + '건이 확인 없이 바뀜';
                out[1] = '상민님이 하실 일: 없음. 작업자가 그 지시를 법정이 다시 확인할 수 있게 고쳐서 다시 심사받아야 합니다. 지금은 “1”을 눌러 배포할 상태가 아닙니다.';
              }
              if (who) {
                // 어떤 판정이든 둘째 줄은 이것이 먼저다. 이 게시로 댓글을 다시 쓰면 "마지막으로 고친 계정"은 법정 계정으로 돌아가므로, 고쳐진 사실은 여기와 이력 줄에 남긴다.
                if (out[1] === four[1]) notes.push('법정 판정서의 둘째 줄(원문): ' + four[1]);
                out[1] = '상민님이 하실 일: [결심 필요] 대상 — 법정 기록이 ' + who + '에 의해 고쳐졌습니다. 이 PR 의 앞선 심사 기록(돌려보낸 횟수·안 됨이던 지시)을 믿을 수 없어 이 PR 에서는 통과가 나오지 않습니다. 작업자는 멈추고 상민님께 보고해야 합니다. 보고를 받으시면 새 PR 로 다시 심사받게 할지 정해 주시면 됩니다.';
              } else if (o.rejectedNow && o.rejects >= ESCALATE_AT) {
                if (!o.laundered.length) notes.push('법정 판정서의 둘째 줄(원문): ' + four[1]);
                out[1] = '상민님이 하실 일: [결심 필요] 대상 — 이 PR 이 ' + (o.rejects === 3 ? '세 번' : o.rejects + '번') + ' 돌려보내졌습니다. 작업자는 멈추고 상민님께 보고해야 합니다. 보고를 받으시면 계속할지 방향을 바꿀지 정해 주시면 됩니다.';
              }
              out[3] = out[3] + ' · 이 PR 돌려보냄 누적 ' + o.rejects + '회';
              return { four: out, notes };
            }

            async function findPr(numbers, shas) {
              for (const n of numbers) {
                if (!Number.isInteger(n) || n <= 0) continue;
                try { const r = await github.rest.pulls.get({ owner, repo, pull_number: n }); if (r.data.base.repo.full_name === fullName) return r.data; } catch (_) { /* 다음 후보 */ }
              }
              // workflow_run.pull_requests 가 비어 오는 경우(포크 등)를 대비해 작업 커밋 sha 로 찾는다.
              for (const sha of shas) {
                if (!isSha(sha)) continue;
                try {
                  const r = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                  const hits = r.data.filter(p => p.head && p.head.sha === sha && p.base && p.base.repo && p.base.repo.full_name === fullName);
                  const hit = hits.find(p => p.state === 'open') || hits[0];
                  if (hit) return (await github.rest.pulls.get({ owner, repo, pull_number: hit.number })).data;
                } catch (_) { /* 다음 후보 */ }
              }
              return null;
            }

            const meta = readJson('meta.json');
            const metaOk = !!meta && meta.schema === 'court-meta/1';
            const v = readJson('verdict.json');
            const problems = verdictProblems(v);
            const valid = problems.length === 0;
            if (valid && metaOk && isSha(meta.headSha) && meta.headSha !== v.head.sha) problems.push('판정서의 작업 커밋이 심사를 청구한 커밋과 다르다');
            // 법정은 판정서에 자기가 돈 GitHub 실행 번호를 적는다. 적혀 있으면 이 심사 실행의 번호와 같아야 한다(다른 실행의 판정서가 끼어드는 것을 막는다).
            if (valid && v.runId !== undefined && v.runId !== null && String(v.runId) !== String(run.id)) problems.push('판정서의 실행 번호(' + clean(v.runId, 24) + ')가 이 심사 실행(' + run.id + ')과 다르다');
            const candidateSha = valid && problems.length === 0 ? v.head.sha : (metaOk && isSha(meta.headSha) ? meta.headSha : null);

            const numbers = (run.pull_requests || []).map(p => p.number);
            if (metaOk && Number.isInteger(meta.pr)) numbers.push(meta.pr);
            const pr = await findPr(numbers, [candidateSha, run.head_sha]);
            if (!pr) { core.warning('이 심사에 해당하는 PR 을 찾지 못했다 — 게시하지 않는다 (run ' + run.id + ')'); return; }
            if (pr.state !== 'open') { core.info('PR #' + pr.number + ' 은 이미 닫혔다 — 게시하지 않는다'); return; }

            // 고정 댓글과 그 안의 이력: 법정 계정(github-actions[bot])이 쓴 표식 댓글만 믿는다. 사람·작업자 계정이 같은 표식을 달아도 법정 댓글로 치지 않는다.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = chat.findPinned(comments);
            let prev = mine ? chat.parseHistory(mine.body) : chat.emptyHistory();
            if (prev.damaged) core.warning('법정 댓글의 이력 줄을 읽을 수 없다 — 누적 횟수를 0 부터 다시 센다');

            // 법정 기록을 법정이 아닌 계정이 고쳤는가: 그 댓글을 마지막으로 고친 계정을 읽는다(court.yml ⑥-1 과 같은 판단 함수 chat.editorTrust).
            //   앞서 그런 적이 있다고 이력에 남아 있으면 다시 묻지 않는다. 고쳐졌으면 앞선 기록을 믿지 않는다(chat.distrust: 누적 3회 이상 + 고친 계정을 이력에 남김).
            //   못 읽었으면 "고쳐졌다"고도 "안 고쳐졌다"고도 하지 않고 본문에 못 읽었다고 적는다(검사 쪽은 ⑥-1 이 못 읽음을 실패로 둔다).
            const hc = readJson('history-check.json');
            let editedBy = prev.editedBy || null;
            let editorUnread = false;
            if (mine && !editedBy) {
              try {
                const trust = chat.editorTrust(await github.graphql(chat.EDITOR_QUERY, { id: mine.node_id }));
                if (trust.known) editedBy = trust.by; else editorUnread = true;
              } catch (e) { editorUnread = true; }
              if (editorUnread) core.warning('법정 댓글을 마지막으로 고친 계정을 읽지 못했다');
            }
            // ⑥-1 이 이미 "고쳐졌다"고 본 경우(그 뒤 조회가 실패했더라도)는 그 판단을 따른다 — 더 엄한 쪽으로만 쓴다.
            if (!editedBy && hc && hc.schema === 'court-history-check/1' && hc.state === 'tampered' && chat.validEditedBy(hc.editedBy)) editedBy = [hc.editedBy[0], hc.editedBy[1]];
            if (editedBy) { prev = chat.distrust(prev, editedBy); core.warning('법정 기록이 ' + chat.editedByText(editedBy) + '에 의해 고쳐졌다 — 앞선 기록을 믿지 않는다'); }

            // 앞선 심사 대조: court.yml ⑥-1 과 같은 함수. 판정이 통과·확인 부족일 때만 뜻이 있다(돌려보냄·심사 못 함은 이미 실패다).
            const passing = valid && (v.verdict === '통과' || v.verdict === '확인 부족');
            const laundered = passing ? chat.launderedReqs(prev, v) : [];
            if (valid && problems.length === 0) {
              const expectSuccess = passing && laundered.length === 0 && !editedBy;
              if ((run.conclusion === 'success') !== expectSuccess) {
                if (passing && editedBy) problems.push('법정 기록이 ' + chat.editedByText(editedBy) + '에 의해 고쳐졌는데 검사 결론은 성공으로 남아 있다 — court 검사를 다시 실행해야 한다');
                else if (passing && laundered.length) problems.push('앞선 심사에서 안 됨이던 지시 ' + laundered.length + '건이 확인 없이 바뀌었는데 검사 결론은 성공으로 남아 있다 — court 검사를 다시 실행해야 한다');
                else if (passing && hc && hc.schema === 'court-history-check/1' && hc.state === 'lookup-failed') problems.push('법정이 앞선 심사 기록을 읽지 못했다 — court 검사를 다시 실행해야 한다');
                else problems.push('검사 결론(' + run.conclusion + ')과 판정서(' + v.verdict + ')가 어긋난다');
              }
            }
            const trusted = valid && problems.length === 0;
            const sha = (trusted ? v.head.sha : candidateSha) || (run.head_sha === pr.head.sha ? run.head_sha : null);
            // 법정 기록이 고쳐진 PR 의 통과·확인 부족은 돌려보냄으로 게시되므로(applyHistory) 돌려보냄으로 센다.
            const rejectedNow = trusted && (v.verdict === '돌려보냄' || laundered.length > 0 || (passing && !!editedBy));
            const stale = !!(sha && sha !== pr.head.sha);
            const next = chat.nextHistory(prev, { sha, rejected: rejectedNow, verdict: trusted ? v : null, addOnly: stale });

            // 옛 커밋의 판정이 새 커밋의 댓글을 덮어쓰지 않게 한다. 새 커밋은 자기 심사가 끝나면 게시된다.
            // 다만 그 옛 커밋이 돌려보내진 사실은 이력에 남긴다(보이는 굵은 네 줄은 그대로 두고 숨은 한 줄만 고친다). 덮어쓸 댓글이 아직 없으면 그대로 게시한다.
            if (stale) {
              if (!rejectedNow) { core.info('판정 대상 ' + sha.slice(0, 7) + ' 은 PR 의 최신 커밋 ' + pr.head.sha.slice(0, 7) + ' 이 아니다 — 게시하지 않는다'); return; }
              if (mine) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: chat.withHistory(mine.body, next) });
                core.info('판정 대상 ' + sha.slice(0, 7) + ' 은 최신 커밋이 아니다 — 굵은 네 줄은 그대로 두고 이력만 고쳤다(돌려보냄 누적 ' + next.rejects + '회)');
                return;
              }
            }

            let four;
            if (trusted) {
              four = firstFourFromReport(readText('REPORT.md'), v);
              if (!four) { core.warning('REPORT.md 에서 굵은 네 줄을 읽지 못해 verdict.json 으로 구성했다'); four = firstFourFromJson(v); }
            } else if (metaOk && meta.sameRepo === false) {
              four = cannotJudgeFour('포크에서 온 PR 은 법정이 심사하지 않습니다', '없음. 이 PR 은 병합할 수 없습니다. 같은 저장소의 브랜치로 다시 올려야 심사받을 수 있습니다.', sha);
            } else {
              // 법정이 판정서를 못 만들었으면, court.yml 이 남긴 사유(있으면)를 그대로 보여 준다 — "왜 못 했는지"가 PR 에서 보여야 한다.
              const cj = readJson('cannot-judge.json');
              const why = cj && cj.schema === 'court-cannot-judge/1' && typeof cj.reason === 'string' && cj.reason.trim() ? clean(cj.reason, 200) : '법정이 판정서를 만들지 못했습니다(자체 점검 실패 또는 도구 오류)';
              // 법정이 시작할 때 미리 써 둔 판정서(interim)만 남았으면 법정이 판정 전에 끝난 것이다(시간 초과·강제 종료). 형식 오류처럼 보이게 하지 않고 그 사실을 말한다.
              if (v && v.interim === true) four = cannotJudgeFour('법정이 판정을 내기 전에 실행이 끝났습니다(시간 초과·강제 종료·중단일 수 있습니다)', '없음. court 검사를 다시 실행하면 됩니다. 통과가 아니므로 배포를 결정하실 단계가 아닙니다.', sha);
              else four = cannotJudgeFour(v ? '판정서를 믿을 수 없습니다: ' + problems.slice(0, 3).join(' / ') : why, null, sha);
            }
            const shown = applyHistory(four, { laundered: trusted ? laundered : [], rejects: next.rejects, rejectedNow, editedBy });
            four = shown.four;

            const out = [MARKER];
            out.push('<!-- court-meta head=' + (sha || 'unknown') + ' verdictId=' + (trusted ? v.verdictId.toUpperCase() : 'none') + ' run=' + run.id + ' -->');
            out.push(chat.historyLine(next));
            for (const l of four) out.push('**' + clean(l, 700) + '**  ');
            out.push('');
            for (const n of shown.notes) out.push('- ' + clean(n, 700));
            if (shown.notes.length) out.push('');
            if (prev.damaged && !editedBy) { out.push('- 주의: 이 댓글에 남아 있던 앞선 이력 줄을 읽을 수 없어 돌려보냄 누적 횟수를 0 부터 다시 셌습니다.'); out.push(''); }
            if (editedBy) { out.push('- 주의: 이 PR 의 법정 기록(이 댓글)이 ' + clean(chat.editedByText(editedBy), 90) + '에 의해 고쳐진 적이 있습니다. 그때부터 앞선 심사 기록을 믿지 않고, 돌려보냄 누적 횟수를 ' + ESCALATE_AT + '회 이상으로 올려 셉니다. 이 표시는 이 PR 에서 지워지지 않습니다.'); out.push(''); }
            if (editorUnread) { out.push('- 주의: 이 댓글을 마지막으로 고친 계정을 이번 게시에서는 읽지 못했습니다(고쳐졌는지 확인하지 못했습니다).'); out.push(''); }
            if (trusted) {
              if (laundered.length) {
                out.push('## 앞선 심사에서 안 됨이던 지시가 확인 없이 바뀜');
                out.push('앞선 심사에서 법정이 직접 해 보고 “안 됨”이라고 본 지시입니다. 이번에는 법정이 다시 확인해 주지 않았는데 다른 칸으로 옮겨져 있습니다. 법정이 같은 지시를 다시 확인해 “화면에서 눌러 확인”이 되어야 풀립니다.');
                out.push('| 지시 | 이번 판정서에서는 |');
                out.push('| :-- | :-- |');
                for (const x of laundered.slice(0, 40)) out.push('| ' + clean(x.id, 44) + ' | **' + clean(x.now, 60) + '** |');
                if (laundered.length > 40) out.push('… 외 ' + (laundered.length - 40) + '건');
                out.push('');
              }
              const rejects = (Array.isArray(v.findings) ? v.findings : []).filter(f => f && f.severity === 'reject');
              if (rejects.length) {
                out.push('## 돌려보낸 이유');
                rejects.slice(0, 20).forEach((f, i) => out.push((i + 1) + '. **' + clean(f.title, 120) + '** — ' + clean(f.text, 500)));
                if (rejects.length > 20) out.push('… 외 ' + (rejects.length - 20) + '건 (전체는 판정서에)');
                out.push('');
              }
              out.push('## 지시 항목별 결과');
              const reqs = v.rollup && Array.isArray(v.rollup.reqs) ? v.rollup.reqs : null;
              if (reqs) {
                out.push('아래 지시 항목은 작업자가 주장 파일에 적어 낸 것입니다. 법정은 이 목록이 상민님 지시 원문과 같은지(빠진 지시가 없는지) 알지 못합니다.');
                out.push('');
                out.push('| 지시 | 작업자가 적어 낸 지시 내용 | 결과 |');
                out.push('| :-- | :-- | :-- |');
                for (const r of reqs.slice(0, 80)) out.push('| ' + clean(r && r.id, 24) + ' | ' + clean(r && r.text, 140) + ' | **' + clean(r && r.bucket, 60) + (r && r.note ? '(' + clean(r.note, 40) + ')' : '') + '** |');
                if (reqs.length > 80) out.push('… 외 ' + (reqs.length - 80) + '건 (전체는 판정서에)');
              } else out.push('주장 파일(claims.json)이 없어 지시 항목별 결과를 낼 수 없습니다.');
              out.push('');
            }
            out.push('---');
            out.push('전체 판정서와 법정이 찍은 화면: ' + run.html_url + ' 의 `court-verdict` 자료. 이 댓글은 법정(GitHub Actions)이 기계로 게시했습니다 — 작업자의 말이 아닙니다.');
            const body = out.join('\n').slice(0, 60000);

            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.info('PR #' + pr.number + ' 에 게시: ' + four[0] + ' (돌려보냄 누적 ' + next.rejects + '회)');
            if (valid && !trusted) core.setFailed('판정서와 검사 결론이 어긋난다: ' + problems.join(' / '));
