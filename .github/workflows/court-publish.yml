name: court-publish

# 법정 판정 게시 — court 워크플로가 끝나면 그 판정서의 첫 네 줄을 PR 고정 댓글로 단다.
#
# 왜 따로 있는가
#   심사 잡(court.yml)은 PR 코드를 실행하므로 쓰기 권한을 줄 수 없다. 댓글을 달려면 쓰기 권한이 필요하다.
#   그래서 "PR 코드를 실행하는 잡(쓰기 권한 없음)"과 "댓글을 다는 잡(PR 코드를 만지지 않음)"을 나눈다.
#
# 이 워크플로는 PR 코드를 체크아웃하지도 실행하지도 않는다. 받는 것은 court 잡이 올린 자료(아티팩트)뿐이다.
#   그 자료도 "남이 쓴 글"로 취급한다: 형식을 검증하고, 줄바꿈·표식·멘션을 걸러서 댓글에 옮기며, 자료 안의 어떤 글자도 실행하지 않는다.
#   (판정서 안에는 작업자가 쓴 주장 문장이 들어 있다. 그 문장이 댓글 안에서 "판정 줄"을 흉내 내지 못하게 한다.)
on:
  workflow_run:
    workflows: [court]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 취소된 심사(같은 PR 에 새 커밋이 와서 그만둔 것)는 게시하지 않는다. 새 커밋의 심사 결과가 곧 게시된다.
    if: github.event.workflow_run.event == 'pull_request_target' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: 판정 자료 받기 (없으면 '심사 못 함'으로 게시한다)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: court-verdict
          path: verdict
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 판정서 첫 네 줄을 PR 고정 댓글로 게시
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const MARKER = '<!-- court-verdict -->';
            const BOT = 'github-actions[bot]';
            const VERDICTS = ['통과', '확인 부족', '돌려보냄', '심사 못 함'];
            const WHERE = 'GitHub 에서 법정이 직접 실행(작업자 PC 밖)';
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const fullName = owner + '/' + repo;
            const dir = path.join(process.env.GITHUB_WORKSPACE || '.', 'verdict');

            // 자료는 남이 쓴 글이다: 크기 상한, 일반 파일만, 파싱 실패는 "없음"으로.
            const readText = name => {
              try { const p = path.join(dir, name); const st = fs.lstatSync(p); if (!st.isFile() || st.size > 8 * 1024 * 1024) return null; return fs.readFileSync(p, 'utf8'); } catch (_) { return null; }
            };
            const readJson = name => { const t = readText(name); if (t === null) return null; try { return JSON.parse(t); } catch (_) { return null; } };
            // 댓글에 옮기는 글자는 한 줄로 펴고, 댓글 표식·HTML·멘션·표 구분자를 무력화한다.
            const clean = (s, max) => String(s === null || s === undefined ? '' : s)
              .replace(/<!--|-->/g, ' ').replace(/[\r\n\t]+/g, ' ').replace(/</g, '&lt;').replace(/@/g, '&#64;').replace(/\|/g, '/')
              .replace(/\s+/g, ' ').trim().slice(0, max || 300);
            const isSha = s => typeof s === 'string' && /^[0-9a-f]{40}$/.test(s);

            function verdictProblems(v) {
              if (!v || typeof v !== 'object' || Array.isArray(v)) return ['verdict.json 이 없거나 읽을 수 없다'];
              const bad = [];
              if (v.schema !== 'court-verdict/1') bad.push('schema 가 court-verdict/1 이 아니다');
              if (!VERDICTS.includes(v.verdict)) bad.push('verdict 가 네 값(통과·확인 부족·돌려보냄·심사 못 함) 중 하나가 아니다');
              if (typeof v.verdictId !== 'string' || !/^[0-9A-Fa-f]{8}$/.test(v.verdictId)) bad.push('verdictId 가 8자 16진수가 아니다');
              if (!v.head || !isSha(v.head.sha)) bad.push('head.sha 가 없다');
              if (v.where !== 'ci') bad.push('GitHub 에서 실행된 판정이 아니다');
              if (v.quick) bad.push('빠른 점검 결과다(화면 점검 없음)');
              return bad;
            }

            // 판정서(REPORT.md)의 첫 네 줄을 "그대로" 가져온다. 넷째 줄에는 판정번호가 찍혀 있고, 판정번호는 작업 커밋 전체의 해시에서 나오므로
            // 작업자가 미리 알고 흉내 낼 수 없다. 그 줄을 닻으로 삼아 바로 위 세 줄까지를 첫 네 줄로 읽는다.
            function firstFourFromReport(text, v) {
              if (typeof text !== 'string') return null;
              const lines = text.split('\n').map(l => l.replace(/\s+$/, ''));
              const i4 = lines.findIndex(l => l.startsWith('**심사 대상 커밋 ') && l.includes('판정번호 ' + v.verdictId));
              if (i4 < 3) return null;
              const four = lines.slice(i4 - 3, i4 + 1);
              if (!four.every(l => /^\*\*.+\*\*$/.test(l))) return null;
              if (!four[0].startsWith('**판정: ' + v.verdict)) return null;
              if (!four[1].startsWith('**상민님이 하실 일: ')) return null;
              return four.map(l => l.slice(2, -2));
            }
            function firstFourFromJson(v) {
              const counts = v.rollup && v.rollup.counts && typeof v.rollup.counts === 'object' ? v.rollup.counts : null;
              return [
                '판정: ' + v.verdict + (v.headline ? ' — ' + v.headline : ''),
                '상민님이 하실 일: ' + (v.todo || ''),
                counts ? '상민님 지시 ' + v.rollup.total + '건 중: ' + Object.keys(counts).map(k => k + ' ' + counts[k]).join(' · ') : '지시 항목 기준 분포: 없음(작업자가 주장을 내지 않았습니다)',
                '심사 대상 커밋 ' + v.head.sha.slice(0, 7) + ' (기준 ' + String((v.base && v.base.sha) || '?').slice(0, 7) + ') · 판정번호 ' + v.verdictId + ' · ' + WHERE,
              ];
            }
            function cannotJudgeFour(reason, todo, sha) {
              return [
                '판정: 심사 못 함(법정 도구 고장 — 통과가 아닙니다) — ' + reason,
                '상민님이 하실 일: ' + (todo || '없음. 법정 도구를 고친 뒤 다시 심사합니다. 통과가 아니므로 배포를 결정하실 단계가 아닙니다.'),
                '지시 항목 기준 분포: 없음(심사하지 못했습니다)',
                '심사 대상 커밋 ' + (sha ? sha.slice(0, 7) : '알 수 없음') + ' · 판정번호 없음 · ' + WHERE,
              ];
            }

            async function findPr(numbers, shas) {
              for (const n of numbers) {
                if (!Number.isInteger(n) || n <= 0) continue;
                try { const r = await github.rest.pulls.get({ owner, repo, pull_number: n }); if (r.data.base.repo.full_name === fullName) return r.data; } catch (_) { /* 다음 후보 */ }
              }
              // workflow_run.pull_requests 가 비어 오는 경우(포크 등)를 대비해 작업 커밋 sha 로 찾는다.
              for (const sha of shas) {
                if (!isSha(sha)) continue;
                try {
                  const r = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                  const hits = r.data.filter(p => p.head && p.head.sha === sha && p.base && p.base.repo && p.base.repo.full_name === fullName);
                  const hit = hits.find(p => p.state === 'open') || hits[0];
                  if (hit) return (await github.rest.pulls.get({ owner, repo, pull_number: hit.number })).data;
                } catch (_) { /* 다음 후보 */ }
              }
              return null;
            }

            const meta = readJson('meta.json');
            const metaOk = !!meta && meta.schema === 'court-meta/1';
            const v = readJson('verdict.json');
            const problems = verdictProblems(v);
            const valid = problems.length === 0;
            if (valid) {
              const passing = v.verdict === '통과' || v.verdict === '확인 부족';
              if ((run.conclusion === 'success') !== passing) problems.push('검사 결론(' + run.conclusion + ')과 판정서(' + v.verdict + ')가 어긋난다');
              if (metaOk && isSha(meta.headSha) && meta.headSha !== v.head.sha) problems.push('판정서의 작업 커밋이 심사를 청구한 커밋과 다르다');
            }
            const trusted = valid && problems.length === 0;
            const judgedSha = trusted ? v.head.sha : (metaOk && isSha(meta.headSha) ? meta.headSha : null);

            const numbers = (run.pull_requests || []).map(p => p.number);
            if (metaOk && Number.isInteger(meta.pr)) numbers.push(meta.pr);
            const pr = await findPr(numbers, [judgedSha, run.head_sha]);
            if (!pr) { core.warning('이 심사에 해당하는 PR 을 찾지 못했다 — 게시하지 않는다 (run ' + run.id + ')'); return; }
            if (pr.state !== 'open') { core.info('PR #' + pr.number + ' 은 이미 닫혔다 — 게시하지 않는다'); return; }
            const sha = judgedSha || (run.head_sha === pr.head.sha ? run.head_sha : null);
            // 옛 커밋의 판정이 새 커밋의 댓글을 덮어쓰지 않게 한다. 새 커밋은 자기 심사가 끝나면 게시된다.
            if (sha && sha !== pr.head.sha) { core.info('판정 대상 ' + sha.slice(0, 7) + ' 은 PR 의 최신 커밋 ' + pr.head.sha.slice(0, 7) + ' 이 아니다 — 게시하지 않는다'); return; }

            let four;
            if (trusted) {
              four = firstFourFromReport(readText('REPORT.md'), v);
              if (!four) { core.warning('REPORT.md 에서 첫 네 줄을 읽지 못해 verdict.json 으로 구성했다'); four = firstFourFromJson(v); }
            } else if (metaOk && meta.sameRepo === false) {
              four = cannotJudgeFour('포크에서 온 PR 은 법정이 심사하지 않습니다', '없음. 이 PR 은 병합할 수 없습니다. 같은 저장소의 브랜치로 다시 올려야 심사받을 수 있습니다.', sha);
            } else {
              four = cannotJudgeFour(v ? '판정서를 믿을 수 없습니다: ' + problems.slice(0, 3).join(' / ') : '법정이 판정서를 만들지 못했습니다(자체 점검 실패 또는 도구 오류)', null, sha);
            }

            const out = [MARKER];
            out.push('<!-- court-meta head=' + (sha || 'unknown') + ' verdictId=' + (trusted ? v.verdictId.toUpperCase() : 'none') + ' run=' + run.id + ' -->');
            for (const l of four) out.push('**' + clean(l, 700) + '**  ');
            out.push('');
            if (trusted) {
              const rejects = (Array.isArray(v.findings) ? v.findings : []).filter(f => f && f.severity === 'reject');
              if (rejects.length) {
                out.push('## 돌려보낸 이유');
                rejects.slice(0, 20).forEach((f, i) => out.push((i + 1) + '. **' + clean(f.title, 120) + '** — ' + clean(f.text, 500)));
                if (rejects.length > 20) out.push('… 외 ' + (rejects.length - 20) + '건 (전체는 판정서에)');
                out.push('');
              }
              out.push('## 지시 항목별 결과');
              const reqs = v.rollup && Array.isArray(v.rollup.reqs) ? v.rollup.reqs : null;
              if (reqs) {
                out.push('| 지시 | 상민님 지시 내용 | 결과 |');
                out.push('| :-- | :-- | :-- |');
                for (const r of reqs.slice(0, 80)) out.push('| ' + clean(r && r.id, 24) + ' | ' + clean(r && r.text, 140) + ' | **' + clean(r && r.bucket, 60) + '** |');
                if (reqs.length > 80) out.push('… 외 ' + (reqs.length - 80) + '건 (전체는 판정서에)');
              } else out.push('주장 파일(claims.json)이 없어 지시 항목별 결과를 낼 수 없습니다.');
              out.push('');
            }
            out.push('---');
            out.push('전체 판정서와 법정이 찍은 화면: ' + run.html_url + ' 의 `court-verdict` 자료. 이 댓글은 법정(GitHub Actions)이 기계로 게시했습니다 — 작업자의 말이 아닙니다.');
            const body = out.join('\n').slice(0, 60000);

            // 고정 댓글: 법정 계정(github-actions[bot])이 쓴 표식 댓글만 찾아 갱신한다. 사람·작업자 계정이 같은 표식을 달아도 법정 댓글로 치지 않는다.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find(c => c.user && c.user.login === BOT && c.user.type === 'Bot' && typeof c.body === 'string' && c.body.startsWith(MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.info('PR #' + pr.number + ' 에 게시: ' + four[0]);
            if (valid && !trusted) core.setFailed('판정서와 검사 결론이 어긋난다: ' + problems.join(' / '));
